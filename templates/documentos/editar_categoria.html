{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">

    <h3>✏️ Editar Categoria</h3>
    <hr>

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn btn-success">
            Salvar Alterações
        </button>

        <a href="{% url 'documentos_por_categoria' categoria.id %}" class="btn btn-secondary">
            Cancelar
        </a>
    </form>

</div>
{% endblock %}
